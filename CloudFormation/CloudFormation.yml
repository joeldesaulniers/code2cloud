AWSTemplateFormatVersion: '2010-09-09'
Description: Simple CloudFormation template that deploys an AWS Lambda function

Parameters:
  EnvironmentType:
    Type: String
    Default: Test
    Description: The environment for this function

  Lambdaname:
    Type: String
    Default: lambda-code-to-cloud-testing
    Description: The name for this function

  Bucketname:
    Type: String
    Default: enter-a-unique-bucket-name
    Description: Must be globally unique - don't forget to create the bucket and upload the index.zip file first!

Resources:
  # IAM Role for Lambda execution
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Function
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref Lambdaname
      Handler: index.handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref Bucketname
        S3Key: index.zip
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentType

Outputs:
  LambdaArn:
    Description: ARN of the Lambda function
    Value: !GetAtt MyLambdaFunction.Arn
